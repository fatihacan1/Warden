{{define "content"}}
<img class="login-mark" src="/admin/static/mark.svg" alt="" width="40" height="40">
<h1>Warden admin</h1>
<p class="lede login-lede">Sign in with the <code>ADMIN_TOKEN</code> from this instance's environment.</p>
{{with .Data}}{{if .Error}}<p class="notice notice-err" role="alert">{{.Error}}</p>{{end}}{{end}}
<form method="post" action="/admin/login">
  <div class="field">
    <label for="token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<p class="help mt-20">This panel should only be reachable from a private network or an SSH tunnel.</p>
{{end}}
