name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warden" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Verify formatting and generated code
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./migrations ./test)" || (gofmt -l . && exit 1)
          go mod tidy && git diff --exit-code go.mod go.sum

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./test/...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Integration tests
        env:
          WARDEN_TEST_POSTGRES: postgres://warden:warden@localhost:5432/postgres?sslmode=disable
          WARDEN_TEST_REDIS: redis://localhost:6379/15
          WARDEN_TEST_S3: "false"
        run: go test -tags integration -count=1 ./test/e2e/

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude-dir=pkg -exclude-generated ./...
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/golang --config p/secrets --config p/jwt --config p/owasp-top-ten \
            --error --metrics=off --exclude pkg

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: warden:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
