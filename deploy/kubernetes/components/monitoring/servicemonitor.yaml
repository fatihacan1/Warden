apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: warden
  labels:
    app.kubernetes.io/name: warden
spec:
  # The alert rules match job="warden", so take the job name from this label.
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: warden
      app.kubernetes.io/component: admin
  endpoints:
    - port: admin
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
