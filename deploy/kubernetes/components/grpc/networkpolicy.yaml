apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warden-allow-grpc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: warden
  policyTypes: [Ingress]
  ingress:
    # Only pods labeled warden-grpc-client=true, in this namespace. To allow
    # another namespace, add a namespaceSelector + podSelector pair.
    - from:
        - podSelector:
            matchLabels:
              warden-grpc-client: "true"
      ports:
        - { protocol: TCP, port: 9091 }
---
# Egress half: default-deny-all also blocks the client pod's outgoing traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warden-grpc-client-egress
spec:
  podSelector:
    matchLabels:
      warden-grpc-client: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: warden
      ports:
        - { protocol: TCP, port: 9091 }
