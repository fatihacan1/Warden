apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is applied by the overlays (namespace: warden).
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - services.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - ingress.yaml

# Non-secret settings. The name gets a content hash suffix, so changing a value
# rolls the pods. Overlays merge their own values on top (behavior: merge).
configMapGenerator:
  - name: warden-config
    envs:
      - config.env

# The image name is a placeholder; overlays set the real one with images:.
images:
  - name: warden
    newName: warden
    newTag: latest

# The Secret warden-secrets is generated by each overlay from its own
# (gitignored) secrets.env, see overlays/*/secrets.env.example.
