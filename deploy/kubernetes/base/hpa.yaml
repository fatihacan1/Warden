apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: warden
  labels:
    app.kubernetes.io/name: warden
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: warden
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
