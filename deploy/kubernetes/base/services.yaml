# Public API. This is the only Service the ingress points at.
apiVersion: v1
kind: Service
metadata:
  name: warden
  labels:
    app.kubernetes.io/name: warden
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: warden
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
---
# Admin UI, /metrics and /healthz. Never expose this one.
# Reach it with: kubectl -n warden port-forward svc/warden-admin 9090:9090
apiVersion: v1
kind: Service
metadata:
  name: warden-admin
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: warden
  ports:
    - { name: admin, port: 9090, targetPort: admin, protocol: TCP }
