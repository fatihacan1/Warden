apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production: 3+ replicas, managed Postgres/Redis outside the cluster, TLS
# ingress, monitoring. See docs/kubernetes.md for the checklist.
namespace: warden

resources:
  - ../../base
  - networkpolicy-datastores.yaml

components:
  - ../../components/monitoring
  # - ../../components/grpc

images:
  - name: warden
    newName: ghcr.io/your-org/warden   # your registry
    newTag: "1.0.0"                    # pin a version, never :latest

replicas:
  - name: warden
    count: 3

configMapGenerator:
  - name: warden-config
    behavior: merge
    literals:
      - APP_ENV=production
      # Must be the public https URL. It is the token issuer and the base of
      # OAuth callback URLs, so changing it later invalidates issued tokens.
      - HTTP_PUBLIC_URL=https://auth.example.com
      # The ingress controller's pod/node range (see docs/kubernetes.md). With
      # ingress-nginx behind a cloud load balancer this is usually the pod CIDR
      # or the VPC range; a wrong value makes every client look like the proxy.
      - HTTP_TRUSTED_PROXIES=10.0.0.0/8
      - HTTP_CORS_ALLOWED_ORIGINS=https://app.example.com
      - AUTH_ALLOWED_REDIRECT_URIS=https://app.example.com/auth/callback
      - AUTH_VERIFY_EMAIL_URL=https://app.example.com/verify-email?token={token}
      - AUTH_RESET_PASSWORD_URL=https://app.example.com/reset-password?token={token}
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_FROM=Warden <no-reply@example.com>
      - PASSWORD_CHECK_BREACHED=true

# Replace this with External Secrets / Sealed Secrets in a real cluster (see
# docs/kubernetes.md). Keeping secrets.env out of git is the minimum.
secretGenerator:
  - name: warden-secrets
    envs:
      - secrets.env

patches:
  - target: { kind: HorizontalPodAutoscaler, name: warden }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target: { kind: Ingress, name: warden }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.example.com
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "true"
      - op: add
        path: /spec/tls
        value:
          - hosts: [auth.example.com]
            secretName: warden-tls
