# Dev datastores live in the namespace, so egress is by pod selector. Needs a
# NetworkPolicy-enforcing CNI to have any effect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warden-allow-egress-dev-deps
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: warden }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: postgres } }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: redis } }
      ports: [{ protocol: TCP, port: 6379 }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: mailpit } }
      ports: [{ protocol: TCP, port: 1025 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-warden
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [postgres, redis, mailpit]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: warden } }
