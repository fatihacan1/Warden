# Local development stack. Every port binds to 127.0.0.1 except Warden's
# public API. Credentials here are development defaults: never reuse them.
#
#   docker compose up -d            # everything, including Warden
#   docker compose up -d postgres redis rabbitmq garage garage-init mailpit   # deps only, run Warden with `go run`
#
# UIs: Warden admin http://localhost:9090  RabbitMQ http://localhost:15672
#      Mailpit http://localhost:8025       Garage Web UI http://localhost:3909
#      With --profile monitoring: Prometheus http://localhost:9092  Grafana http://localhost:3001

name: warden

x-garage-env: &garage-env
  GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec}
  GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dev-garage-admin-token-change-me}
  GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-dev-garage-metrics-token-change-me}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden
      POSTGRES_DB: warden
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden -d warden"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Every key Warden writes has a TTL, so volatile-lru is a safe policy.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: warden
      RABBITMQ_DEFAULT_PASS: warden
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.1.0
    environment: *garage-env
    ports: ["127.0.0.1:3900:3900", "127.0.0.1:3903:3903"]
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

  garage-init:
    build: ./deploy/garage
    environment:
      <<: *garage-env
      S3_BUCKET: ${S3_BUCKET:-warden}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK31c2f218a2e44f485b94239e}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-b892c0665f0ada8a4755dae98baa3b133590e11dae3bcc1f9d769d67f16c3835}
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta:ro
    depends_on: [garage]
    restart: "no"

  garage-webui:
    image: khairul169/garage-webui:latest
    environment:
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:-dev-garage-admin-token-change-me}
    ports: ["127.0.0.1:3909:3909"]
    depends_on: [garage]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    restart: unless-stopped

  warden:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    env_file: [.env]
    environment:
      # Container hostnames override the localhost values used by `go run`.
      DATABASE_URL: postgres://warden:warden@postgres:5432/warden?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://warden:warden@rabbitmq:5672/
      S3_ENDPOINT: http://garage:3900
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_POLICY: none
      GOMEMLIMIT: 450MiB
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 512M }
    restart: unless-stopped

  # Monitoring, opt-in: docker compose --profile monitoring up -d
  # Prometheus http://localhost:9092   Grafana http://localhost:3001 (admin / admin)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9092:9090"]
    depends_on: [warden]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  promdata:
  grafanadata:
  pgdata:
  redisdata:
  rabbitdata:
  garage-meta:
  garage-data:
