openapi: 3.1.0
info:
  title: Warden public API
  version: 1.0.0
  summary: Authentication service for web and mobile apps.
  description: |
    Sign-up, sign-in, social login, MFA and session management.

    Access tokens are ES256 JWTs (`typ: at+jwt`). Verify them in your services
    with the keys at `/.well-known/jwks.json`. Refresh tokens are opaque, single
    use, and rotated on every refresh.

    Browser apps can send `X-Auth-Mode: cookie` to receive the refresh token as
    an HttpOnly cookie instead of in the response body.

    Apps identify themselves with a publishable key in `X-Warden-Key`
    (required when the instance enforces it). Backends call the server API
    (`/v1/server`) with a secret key; never ship a secret key to a browser or
    a phone.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Email and password sign-in, tokens
  - name: OAuth
    description: Social sign-in
  - name: Account
    description: The signed-in user
  - name: MFA
    description: Two-factor authentication
  - name: Server
    description: For your backends, with a secret key
  - name: GraphQL
    description: Optional, when GRAPHQL_ENABLED=true
  - name: Discovery
    description: Keys and health

paths:
  /v1/auth/providers:
    get:
      tags: [Auth]
      summary: Enabled sign-in methods and public settings
      operationId: listProviders
      security: []
      responses:
        "200":
          description: Sign-in options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }

  /v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create a password account
      operationId: signUp
      security: []
      parameters: [{ $ref: "#/components/parameters/AuthMode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
                name: { type: string, maxLength: 100 }
                locale: { type: string, enum: [en, tr], description: "Email language. Defaults to Accept-Language, then the instance default." }
      responses:
        "201": { $ref: "#/components/responses/Auth" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/signin:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      description: Returns `status = mfa_required` with an `mfa_token` when two-factor authentication is enabled.
      operationId: signIn
      security: []
      parameters: [{ $ref: "#/components/parameters/AuthMode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Busy" }

  /v1/auth/mfa/verify:
    post:
      tags: [MFA]
      summary: Complete sign-in with a TOTP or recovery code
      operationId: verifyMFA
      security: []
      parameters: [{ $ref: "#/components/parameters/AuthMode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string, description: "6 digit TOTP code or recovery code (xxxxx-xxxxx)" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: |
        Returns a new access token and a new refresh token. The old refresh
        token stops working. Replaying an old token after a short grace period
        revokes the whole session. In cookie mode the token is read from the
        HttpOnly cookie and the body may be empty.
      operationId: refresh
      security: []
      parameters: [{ $ref: "#/components/parameters/AuthMode" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/signout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      description: Accepts the refresh token (body or cookie mode) or a bearer access token. Idempotent.
      operationId: signOut
      security: [{}, { bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/AuthMode" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Signed out }

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      summary: Confirm an email address
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { type: object, properties: { verified: { type: boolean } } }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: Always returns 202, whether or not the account exists.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: Signs out every session of the user.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { type: object, properties: { reset: { type: boolean } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/auth/sessions/end:
    get:
      tags: [Auth]
      summary: Confirmation page for the link in a new device email
      description: Shows a page with a button. GET never changes anything, because mail scanners open links.
      operationId: endSessionPage
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: HTML confirmation page }
    post:
      tags: [Auth]
      summary: End the session reported in a new device email
      operationId: endSession
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: HTML page, session ended }
        "400": { description: Link used or expired }

  /v1/oauth/{provider}/authorize:
    get:
      tags: [OAuth]
      summary: Start social sign-in
      description: Redirects the browser to the identity provider.
      operationId: oauthAuthorize
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - { name: redirect_uri, in: query, required: true, schema: { type: string }, description: Must exactly match an allowed redirect URI }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 43 }, description: "base64url(sha256(code_verifier))" }
        - { name: code_challenge_method, in: query, schema: { type: string, enum: [S256], default: S256 } }
        - { name: state, in: query, schema: { type: string, maxLength: 512 }, description: Returned unchanged to redirect_uri }
      responses:
        "302": { description: Redirect to the provider }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/oauth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: Provider callback (register this URL with the provider)
      description: Redirects to `redirect_uri?code=...&state=...` or `redirect_uri?error=...&state=...`.
      operationId: oauthCallback
      security: []
      parameters: [{ $ref: "#/components/parameters/Provider" }]
      responses:
        "303": { description: Redirect back to the app }
        "401": { description: Invalid or expired sign-in request (HTML page) }
    post:
      tags: [OAuth]
      summary: Provider callback for form_post (Apple)
      operationId: oauthCallbackPost
      security: []
      parameters: [{ $ref: "#/components/parameters/Provider" }]
      responses:
        "303": { description: Redirect back to the app }

  /v1/oauth/token:
    post:
      tags: [OAuth]
      summary: Exchange the one-time login code for tokens
      operationId: oauthToken
      security: []
      parameters: [{ $ref: "#/components/parameters/AuthMode" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier, redirect_uri]
              properties:
                code: { type: string }
                code_verifier: { type: string, minLength: 43, maxLength: 128 }
                redirect_uri: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/oauth/{provider}/native:
    post:
      tags: [OAuth]
      summary: Sign in with an ID token from a native SDK (apple, google)
      operationId: oauthNative
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/AuthMode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, nonce]
              properties:
                id_token: { type: string }
                nonce: { type: string, minLength: 16, description: The raw nonce; Apple tokens may contain its SHA-256 hex }
                name: { type: string, description: "Display name (Apple shares it only with the app, on first sign-in)" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "201": { $ref: "#/components/responses/Auth" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      tags: [Account]
      summary: Current user
      operationId: getMe
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Account]
      summary: Update profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                locale: { type: string, enum: ["", en, tr], description: "Email language; empty string = instance default" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      tags: [Account]
      summary: Delete the account permanently
      description: Requires the password, or a recent sign-in for accounts without one.
      operationId: deleteMe
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/me/password:
    post:
      tags: [Account]
      summary: Change the password (or set one for social-only accounts)
      description: Signs out every other session.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /v1/me/email/resend:
    post:
      tags: [Account]
      summary: Resend the verification email
      operationId: resendVerification
      responses:
        "202": { description: Sent if the email is not verified yet }

  /v1/me/avatar:
    put:
      tags: [Account]
      summary: Upload an avatar
      description: JPEG, PNG, GIF or WebP. Stored as a 512x512 JPEG.
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
          image/*:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Account]
      summary: Remove the avatar
      operationId: deleteAvatar
      responses:
        "204": { description: Removed }

  /v1/me/sessions:
    get:
      tags: [Account]
      summary: Active sessions (devices)
      operationId: listSessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }
    delete:
      tags: [Account]
      summary: Sign out every other device
      operationId: revokeOtherSessions
      responses:
        "200":
          description: Number of revoked sessions
          content:
            application/json:
              schema: { type: object, properties: { revoked: { type: integer } } }

  /v1/me/sessions/{id}:
    delete:
      tags: [Account]
      summary: Sign out one device
      operationId: revokeSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }

  /v1/me/identities:
    get:
      tags: [Account]
      summary: Linked social accounts
      operationId: listIdentities
      responses:
        "200":
          description: Identities
          content:
            application/json:
              schema:
                type: object
                properties:
                  identities:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        email: { type: string }
                        created_at: { type: string, format: date-time }
                        last_used_at: { type: string, format: date-time }

  /v1/me/identities/{provider}:
    delete:
      tags: [Account]
      summary: Unlink a social account
      description: Refused with `last_credential` when it is the only way to sign in.
      operationId: unlinkIdentity
      parameters: [{ $ref: "#/components/parameters/Provider" }]
      responses:
        "204": { description: Unlinked }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/me/mfa/totp/setup:
    post:
      tags: [MFA]
      summary: Start authenticator app enrollment
      operationId: totpSetup
      responses:
        "200":
          description: Secret to show as a QR code (valid 10 minutes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string }
        "409": { $ref: "#/components/responses/Error" }

  /v1/me/mfa/totp/enable:
    post:
      tags: [MFA]
      summary: Confirm enrollment with a code
      operationId: totpEnable
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200":
          description: Enabled; recovery codes are shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  recovery_codes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me/mfa/totp/disable:
    post:
      tags: [MFA]
      summary: Turn two-factor authentication off
      operationId: totpDisable
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { description: Disabled }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me/mfa/recovery-codes:
    post:
      tags: [MFA]
      summary: Replace recovery codes
      operationId: regenerateRecoveryCodes
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200":
          description: New recovery codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }

  /v1/server/users:
    post:
      tags: [Server]
      summary: Create a user
      description: Works even when self-service sign-up is off. Password is optional; roles and a verified email can be set directly.
      operationId: serverCreateUser
      security: [{ secretKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                name: { type: string, maxLength: 100 }
                roles: { type: array, items: { type: string, pattern: "^[a-z][a-z0-9_:.-]{0,63}$" }, maxItems: 32 }
                email_verified: { type: boolean, default: false }
                locale: { type: string, enum: [en, tr] }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerUser" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [Server]
      summary: Find a user by email
      operationId: serverFindUser
      security: [{ secretKey: [] }]
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerUser" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/server/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Server]
      summary: Get a user
      operationId: serverGetUser
      security: [{ secretKey: [] }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerUser" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Server]
      summary: Update name, roles or disabled state
      description: Roles appear in the user's next access token. Disabling signs the user out everywhere.
      operationId: serverUpdateUser
      security: [{ secretKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                roles: { type: array, items: { type: string } }
                disabled: { type: boolean }
                locale: { type: string, enum: ["", en, tr] }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerUser" }

  /v1/server/users/{id}/sessions:
    delete:
      tags: [Server]
      summary: Sign a user out everywhere
      operationId: serverRevokeSessions
      security: [{ secretKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Number of sessions revoked
          content:
            application/json:
              schema: { type: object, properties: { revoked: { type: integer } } }

  /v1/server/tokens/verify:
    post:
      tags: [Server]
      summary: Introspect an access token
      description: Signature, expiry and revocation check. With check_session the session and user are loaded from the database and the current roles are returned.
      operationId: serverVerifyToken
      security: [{ secretKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                check_session: { type: boolean, default: false }
      responses:
        "200":
          description: Introspection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Introspection" }

  /graphql:
    post:
      tags: [GraphQL]
      summary: GraphQL endpoint
      description: Account queries and mutations with an access token; user and setUserRoles with a secret key. One operation per request, bounded depth and size, introspection off in production.
      operationId: graphql
      security: [{ bearer: [] }, { secretKey: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                operationName: { type: string }
                variables: { type: object }
      responses:
        "200":
          description: GraphQL response (errors carry extensions.code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  errors: { type: array, items: { type: object } }

  /.well-known/jwks.json:
    get:
      tags: [Discovery]
      summary: Public signing keys (JWKS)
      operationId: jwks
      security: []
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/jwk-set+json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: object } }

  /.well-known/openid-configuration:
    get:
      tags: [Discovery]
      summary: Discovery document (issuer, jwks_uri)
      operationId: discovery
      security: []
      responses:
        "200":
          description: Discovery document
          content:
            application/json:
              schema: { type: object }

  /healthz:
    get:
      tags: [Discovery]
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        "200": { description: Process is alive }

  /readyz:
    get:
      tags: [Discovery]
      summary: Readiness probe (Postgres and Redis)
      operationId: readyz
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: A dependency is unavailable }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from sign-in or refresh.
    secretKey:
      type: http
      scheme: bearer
      description: Secret key (sk_live_... / sk_test_...) from the admin UI. Server to server only; requests with a browser Origin header are rejected.
    publishableKey:
      type: apiKey
      in: header
      name: X-Warden-Key
      description: Publishable key (pk_live_... / pk_test_...) identifying the calling app. Required when the instance enforces it.

  parameters:
    AuthMode:
      name: X-Auth-Mode
      in: header
      required: false
      description: Send `cookie` to receive and send the refresh token as an HttpOnly cookie (browser apps).
      schema: { type: string, enum: [cookie] }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, apple, github, discord] }

  requestBodies:
    Code:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string }

  responses:
    Auth:
      description: Authentication result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Busy:
      description: Server busy, retry later
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [invalid_credentials] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            request_id: { type: string }

    Tokens:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds }
        expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: Omitted in cookie mode }
        session_id: { type: string, format: uuid }

    AuthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [authenticated, mfa_required, verification_required] }
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/Tokens" }
        mfa_token: { type: string, description: Present when status is mfa_required }
        new_user: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        name: { type: string }
        avatar_url: { type: string }
        roles: { type: array, items: { type: string } }
        locale: { type: string, description: "Email language (en, tr); empty = instance default" }
        mfa_enabled: { type: boolean }
        has_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_sign_in_at: { type: string, format: date-time }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean }
        user_agent: { type: string }
        ip: { type: string }
        amr: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    ServerUser:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          properties:
            disabled: { type: boolean }
            updated_at: { type: string, format: date-time }

    Introspection:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        reason: { type: string, enum: [invalid_token, session_revoked, user_disabled] }
        user_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        roles: { type: array, items: { type: string } }
        amr: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }

    Event:
      type: object
      description: Body of every webhook request and RabbitMQ message. Deduplicate on id.
      required: [id, type, occurred_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [user.created, user.updated, user.deleted, user.email_verified, user.password_changed, user.signed_in,
                 user.disabled, user.enabled, user.mfa_enabled, user.mfa_disabled, identity.linked, identity.unlinked,
                 session.revoked, webhook.test]
        occurred_at: { type: string, format: date-time }
        user_id: { type: string, format: uuid }
        data: { type: object }

    Providers:
      type: object
      properties:
        password: { type: boolean }
        signup_enabled: { type: boolean }
        email_verification_required: { type: boolean }
        password_min_length: { type: integer }
        providers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              display_name: { type: string }
              authorize_url: { type: string }
              native: { type: boolean }

security:
  - bearer: []

webhooks:
  event:
    post:
      summary: Event delivered to a webhook endpoint
      description: |
        Signed per Standard Webhooks: webhook-signature is "v1," + base64(HMAC-SHA256(secret, id + "." + timestamp + "." + body)),
        where secret is the base64 part after "whsec_". Reject timestamps older than 5 minutes. Answer 2xx; 410 stops deliveries.
      parameters:
        - { name: webhook-id, in: header, required: true, schema: { type: string } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: integer } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Event" }
      responses:
        "204": { description: Received }
